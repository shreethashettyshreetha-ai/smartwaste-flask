{% extends "base.html" %}


{% block title %}
Register - SmartWaste AI
{% endblock %}


{% block content %}

<div class="auth-page">

    <div class="auth-card">


        <div class="logo">

            ♻ SmartWaste AI

        </div>


        <h1>
            Create Account
        </h1>


        <p>
            Create your SmartWaste AI account.
        </p>


        <form method="POST">


            <!-- NAME -->

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <!-- EMAIL -->

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >


            <button
                type="submit"
                class="btn primary full">

                Create Account

            </button>


        </form>


        <p class="auth-link">

            Already have an account?

            <a href="{{ url_for('login') }}">

                Login

            </a>

        </p>


    </div>

</div>

{% endblock %}
